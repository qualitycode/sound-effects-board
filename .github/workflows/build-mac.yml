name: Build Mac app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build .dmg (Apple Silicon and Intel)
        run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: SoundEffectsBoard-mac
          path: dist/*.dmg
          if-no-files-found: error
