# Add inside the EXISTING HTTPS server block for slidetrip.com.
# Reviewed server file: /etc/nginx/sites-enabled/slidetrip.com.
# Place before the existing /shared/ location; preserve other routes.
# Do not replace the server block or its existing routes/certificate settings.
location = /sb {
    return 308 https://slidetrip.com/sb/$is_args$args;
}
location ^~ /sb/ {
    # Keep login cookies, Origin checks, and offline storage on one hostname.
    if ($host = www.slidetrip.com) {
        return 308 https://slidetrip.com$request_uri;
    }
    # Keep /sb/ in the upstream URI (no trailing slash on proxy_pass).
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 128m;
    proxy_read_timeout 120s;
    proxy_cache off;
}
